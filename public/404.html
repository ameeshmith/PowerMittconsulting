<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>PowerMitt Consulting | Page Redirect</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1;
      var l = window.location;
      var pathSegments = l.pathname.split('/').filter(Boolean);
      var repoSegment = pathSegments.length > 0 ? '/' + pathSegments[0] : '';
      var subRoute = pathSegments.slice(1).join('/');
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoSegment + '/?/' +
        subRoute.replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
