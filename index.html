    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          });
          var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
          var routePath = decoded[0].startsWith('/') ? decoded[0] : '/' + decoded[0];
          var query = decoded.slice(1).join('&');
          window.history.replaceState(null, null, basePath + routePath + (query ? '?' + query : '') + l.hash);
        }
      }(window.location))
    </script>
